[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steward"
version = "0.2.0"
description = "An operational agent that catches problems buried in community group chats, links them to institutional memory, and drives them to resolution."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Narrative Node Labs" }]

dependencies = [
    "bedrock-agentcore>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "strands-agents>=1.53.0",
    "pydantic>=2.9",
    "pydantic-settings==2.15.0",
    "boto3>=1.35",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyJWT[crypto]>=2.9,<3",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
]

[project.scripts]
steward-backup-check = "steward.backup:main"
steward-index-memory = "steward.memory.semantic:main"
steward-bootstrap = "steward.simulation:bootstrap"
steward-smoke = "steward.demo.replay:main"
steward-quote-smoke = "steward.demo.quote_decision:main"
steward-demo = "steward.demo.full_cycle:main"
steward-runtime = "steward.runtime:main"
steward-server = "steward.api:main"
steward-worker = "steward.worker:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["infra/cdk.out", "web/node_modules", ".scratch", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI consumes these immutable declarations; it does not reuse mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
